[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberwatchtower"
version = "0.1.0"
description = "Open-source AI-assisted cybersecurity platform"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
cyberwatchtower = "cyberwatchtower.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cyberwatchtower.memory.schema" = ["*.sql"]
